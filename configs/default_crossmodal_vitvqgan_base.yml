architecture:
  vqgan_RGB:
    img_channels: 3
    img_size: 64
    patch_size: 8 # ViT编码时每个patch的边长
    dim: 512 # ViT主干的特征维度（embedding维度），即每个patch编码后的向量长度
    depth: 4
    heads: 8
    mlp_dim: 1024 # Transformer中MLP部分的隐藏层维度，通常是dim的2~4倍
    dropout: 0.1
    num_codebook_vectors: 128

  vqgan_CIR:
    img_channels: 1
    img_size: 64
    patch_size: 8
    dim: 512
    depth: 4
    heads: 8
    mlp_dim: 1024
    dropout: 0.1
    num_codebook_vectors: 128

  transformer:
    sos_token: 0
    pkeep: 0.5 # mask概率，训练时用于随机mask部分token，提升鲁棒性
    block_size: 512 # Transformer最大输入序列长度（token数），要大于等于RGB token数 + 1 + CIR token数
    n_layer: 8 # Transformer层数（block数），决定模型深度
    n_head: 8
    n_embd: 256

trainer:
  vqgan_RGB:
    learning_rate: 2.0e-4
    beta1: 0.5
    beta2: 0.9
    perceptual_loss_factor: 0
    rec_loss_factor: 1.0
    disc_factor: 1.0
    disc_start: 1000 # 是batch的数量
    perceptual_model: "vgg"
    save_every: 100

  vqgan_CIR:
    learning_rate: 2.0e-4
    beta1: 0.5
    beta2: 0.9
    perceptual_loss_factor: 0
    rec_loss_factor: 1.0
    disc_factor: 1.0
    disc_start: 1000
    perceptual_model: "vgg"
    save_every: 100

  transformer:
    learning_rate: 4.5e-04
    beta1: 0.9
    beta2: 0.95
